name: Worker checks

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check src/index.js
      - run: npx --yes wrangler@4 deploy --dry-run
